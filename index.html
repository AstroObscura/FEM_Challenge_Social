<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./design/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" href="./style.css" />
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
<main>
    <div id="main_card">
        <div id="titles">
            <img src="./design/images/avatar-jessica.jpeg" alt="an image of Jessica Randall">
            <h1>Jessica Randall</h1>
            <h2>London, United Kingdom</h2>
            <p>"Front-end developer and avid reader."</p>
        </div>
        <nav class="nav_hold">
            <a href="https://github.com/" target="_blank">
            <div class="nav_card">
                <h3 class="nav_name">GitHub</h3>
            </div>
            </a>
            <a href="https://www.frontendmentor.io/" target="_blank">
            <div class="nav_card">
                <h3 class="nav_name">Frontend Mentor</h3>
            </div>
            </a>
            <a href="https://uk.linkedin.com/" target="_blank">
            <div class="nav_card">
                <h3 class="nav_name">LinkedIn</h3>
            </div>
            </a>
            <a href="https://x.com/?lang=en" target="_blank">
            <div class="nav_card">
                <h3 class="nav_name">Twitter</h3>
            </div>
            </a>
            <a href="https://www.instagram.com/" target="_blank">
            <div class="nav_card">
                <h3 class="nav_name">Instagram</h3>
            </div>
            </a>
        </nav>
    </div>
</main>

 <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/AstroObscura">Liam Gallagher (Astor_Obscura)</a>.
  </footer>
</body>
</html>
